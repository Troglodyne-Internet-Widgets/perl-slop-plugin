# The packages of the operating system that the distribution needs.
# [MetaMergeFile] merges this file into META.json.  perldoc
# Dist::Conformance::Check::SystemPackages gives the rules.
x_system_packages:
  # Documentation::PodSpelling runs aspell over the POD, with the
  # spell_command of .perlcriticrc.  Without aspell, the policy turns itself
  # off, and the spelling of the POD is not checked.
  aspell:
    deb: aspell
    rpm: aspell
    test: aspell --version
  # The dictionary of the --lang of that spell_command.
  aspell-en:
    deb: aspell-en
    rpm: aspell-en
    test: aspell --lang=en_US -a
  # The EPEL archive, which has aspell-en on RHEL and the distros built from
  # it.  An installer must install it before aspell-en.
  epel-release:
    deb:
      debian: ~
      ubuntu: ~
    rpm:
      fedora: ~
      rhel: epel-release
      centos: epel-release
      rocky: epel-release
      almalinux: epel-release
