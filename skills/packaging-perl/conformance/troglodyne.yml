# What every distribution of the packaging-perl skill has, whatever perl it
# runs on.  It names no perlcritic profile, because the perl decides which, so a
# distribution picks troglodyne-5.040 or troglodyne-compat.
name: troglodyne
description: The build, agent harness and tools of every troglodyne distribution
variables:
  VERSION: '0.001'
checks:
  # Before ClaudeMd and ClaudeSettings, which run after it by name.  ClaudeMd
  # only reads its file, and ClaudeSettings would write settings that name no
  # marketplace, so a clone could not install the plugins that the gates need.
  AgentInstructions:
    module: ToolConfiguration
    files:
      CLAUDE.md: templates/CLAUDE.md
      .claude/settings.json: templates/claude-settings.json
      .perl-slop.json: templates/perl-slop.json
  # The plugins whose skills the hooks and the gates of .perl-slop.json ask for.
  ClaudeSettings:
    file: .claude/settings.json
    plugins:
      - perl-slop@troglodyne-marketplace
      - simple-english@simple-english
  ClaudeMd:
    file: CLAUDE.md
    template: templates/CLAUDE.md
    mentions:
      - perl-slop:reading-perl
  # The authordeps of dist.ini, which Distribution writes only when the file is
  # missing.  The template raises a version when the build needs a newer
  # release, and this raises it in every distribution.  .conformance.yml can
  # turn one off, or ask for another version, under overrides.
  AuthorDeps:
    file: dist.ini
    template: templates/dist.ini
  Distribution:
    module: ToolConfiguration
    files:
      dist.ini: templates/dist.ini
      weaver.ini: templates/weaver.ini
      Changes: templates/Changes
      prereqs.yml: templates/prereqs.yml
      MANIFEST.SKIP: templates/MANIFEST.SKIP
      LICENSE: templates/LICENSE
      .gitignore: templates/gitignore
      .mailmap: templates/mailmap
  ToolConfiguration:
    files:
      .perltidyrc: templates/perltidyrc
      .preferred_modules.ini: templates/preferred_modules.ini
      .pod_stopwords: templates/pod_stopwords
      .tests-covering-map.pl: templates/tests-covering-map.pl
  GitHooks:
    directory: git-hooks
    hooks:
      pre-commit: templates/pre-commit
      post-commit: templates/post-commit
      post-merge: templates/post-merge
      post-rewrite: templates/post-rewrite
      refresh-coverage: templates/refresh-coverage
    differ: info
    replace: false
    install: true
  # The keys that hooks/skill-gates.pl reads, which ignores any other.
  # AgentInstructions writes the file, so a distribution without it does not
  # conform.
  SkillGates:
    module: DataSchema
    file: .perl-slop.json
    missing: fail
    schema:
      type: object
      additionalProperties: false
      properties:
        # A path glob to one skill, or to a list of them.
        before_edit: &gate
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
        before_commit: *gate
        # The program that hooks/skill-gates.pl runs on the prose of a post or a
        # commit, relative to the root of the repository.
        prose_check:
          type: string
  # user overrides the account in the URL of the origin remote, so the
  # metadata names the old place once the repository moves.  The template no
  # longer sets it, so this finds the distributions that still do, and update
  # removes the line.
  GithubMetaFromRemote:
    module: RefusedIniKeys
    file: dist.ini
    missing: info
    refuse:
      GithubMeta:
        user: overrides the account in the URL of the origin remote
  # The system packages that metamerge.yml declares under x_system_packages.
  # Each distribution declares those of the template, such as aspell, which
  # the spelling test of the POD runs.  A distribution keeps its own entry
  # for such a package, and its other packages.
  SystemPackages:
    template: templates/metamerge.yml
