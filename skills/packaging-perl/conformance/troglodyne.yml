# What every distribution of the packaging-perl skill has, whatever perl it
# runs on.  It names no perlcritic profile, because the perl decides which, so a
# distribution picks troglodyne-5.040 or troglodyne-compat.
name: troglodyne
description: The build, agent harness and tools of every troglodyne distribution
variables:
  VERSION: '0.001'
checks:
  # Before ClaudeMd and ClaudeSettings, which run after it by name.  ClaudeMd
  # only reads its file, and ClaudeSettings would write settings that name no
  # marketplace, so a clone could not install the plugins that the gates need.
  AgentInstructions:
    module: ToolConfiguration
    files:
      CLAUDE.md: templates/CLAUDE.md
      .claude/settings.json: templates/claude-settings.json
      .perl-slop.json: templates/perl-slop.json
  # The plugins whose skills the hooks and the gates of .perl-slop.json ask for.
  ClaudeSettings:
    file: .claude/settings.json
    plugins:
      - perl-slop@troglodyne-marketplace
      - simple-english@simple-english
  ClaudeMd:
    file: CLAUDE.md
    template: templates/CLAUDE.md
    mentions:
      - perl-slop:reading-perl
  Distribution:
    module: ToolConfiguration
    files:
      dist.ini: templates/dist.ini
      weaver.ini: templates/weaver.ini
      Changes: templates/Changes
      prereqs.yml: templates/prereqs.yml
      LICENSE: templates/LICENSE
      .gitignore: templates/gitignore
      .mailmap: templates/mailmap
  ToolConfiguration:
    files:
      .perltidyrc: templates/perltidyrc
      .preferred_modules.ini: templates/preferred_modules.ini
      .pod_stopwords: templates/pod_stopwords
      .tests-covering-map.pl: templates/tests-covering-map.pl
  GitHooks:
    directory: git-hooks
    hooks:
      pre-commit: templates/pre-commit
      post-commit: templates/post-commit
    differ: info
    replace: false
    install: true
  # The keys that hooks/skill-gates.pl reads, which ignores any other.
  # AgentInstructions writes the file, so a distribution without it does not
  # conform.
  SkillGates:
    module: DataSchema
    file: .perl-slop.json
    missing: fail
    schema:
      type: object
      additionalProperties: false
      properties:
        # A path glob to one skill, or to a list of them.
        before_edit: &gate
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
        before_commit: *gate
